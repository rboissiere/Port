<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Archivo, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Illustration of a friendly materials-design app: ranked candidate formulas, predicted properties, and an AI suggestion with a guided tip">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#e96e01"/></linearGradient>
    <linearGradient id="vi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6cf0"/><stop offset="1" stop-color="#5a3fa6"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#13516e" flood-opacity=".18"/></filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a3fa6" flood-opacity=".25"/></filter>
  </defs>
  <!-- window -->
  <g filter="url(#sh)"><rect x="20" y="30" width="700" height="440" rx="18" fill="#fff"/></g>
  <rect x="20" y="30" width="700" height="46" rx="18" fill="#13516e"/><rect x="20" y="60" width="700" height="16" fill="#13516e"/>
  <circle cx="46" cy="53" r="5.5" fill="#ff8a7a"/><circle cx="64" cy="53" r="5.5" fill="#ffc86b"/><circle cx="82" cy="53" r="5.5" fill="#7fd1a8"/>
  <text x="370" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Formulation Designer</text>
  <rect x="610" y="42" width="94" height="22" rx="11" fill="#e96e01"/><text x="657" y="57" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">Run AI</text>
  <!-- sidebar -->
  <rect x="20" y="76" width="140" height="394" fill="#f4f7f9"/>
  <g font-size="12.5" font-weight="600" fill="#4a6470">
    <rect x="32" y="96" width="116" height="30" rx="8" fill="#fff" stroke="#e3ebef"/><circle cx="48" cy="111" r="5" fill="#e96e01"/><text x="60" y="115" fill="#13516e" font-weight="700">Goals</text>
    <circle cx="48" cy="151" r="5" fill="#b8c7cf"/><text x="60" y="155">Ingredients</text>
    <circle cx="48" cy="187" r="5" fill="#b8c7cf"/><text x="60" y="191">Experiments</text>
    <circle cx="48" cy="223" r="5" fill="#b8c7cf"/><text x="60" y="227">AI Models</text>
    <circle cx="48" cy="259" r="5" fill="#b8c7cf"/><text x="60" y="263">Team</text>
  </g>
  <!-- goal chips -->
  <text x="182" y="108" font-size="13" font-weight="700" fill="#13516e">Your Goal</text>
  <g font-size="12" font-weight="600">
    <rect x="182" y="118" width="128" height="28" rx="14" fill="#fde1c4"/><text x="246" y="136" text-anchor="middle" fill="#a24c00">Viscosity under 900</text>
    <rect x="318" y="118" width="112" height="28" rx="14" fill="#e6e1fa"/><text x="374" y="136" text-anchor="middle" fill="#5a3fa6">PFAS free</text>
    <rect x="438" y="118" width="122" height="28" rx="14" fill="#d8f0e2"/><text x="499" y="136" text-anchor="middle" fill="#1f7a4a">Lower cost</text>
  </g>
  <!-- candidates -->
  <text x="182" y="178" font-size="13" font-weight="700" fill="#13516e">Top Candidates</text>
  <g font-size="12.5" font-weight="600" fill="#2b3a40">
    <rect x="182" y="190" width="380" height="50" rx="12" fill="#fff6ec" stroke="#ffb066" stroke-width="2"/>
    <text x="198" y="212" font-weight="700">Blend A-12</text><text x="198" y="229" font-size="11" fill="#6a7d85">Swap resin for bio-based polymer</text>
    <rect x="410" y="207" width="110" height="10" rx="5" fill="#f1e3d6"/><rect x="410" y="207" width="101" height="10" rx="5" fill="url(#or)"/><text x="548" y="218" text-anchor="end" font-weight="800" fill="#e96e01">92</text>
    <rect x="182" y="248" width="380" height="50" rx="12" fill="#fff" stroke="#e3ebef"/>
    <text x="198" y="270" font-weight="700">Blend B-07</text><text x="198" y="287" font-size="11" fill="#6a7d85">Reduce additive by 12%</text>
    <rect x="410" y="265" width="110" height="10" rx="5" fill="#ece8f6"/><rect x="410" y="265" width="86" height="10" rx="5" fill="url(#vi)"/><text x="548" y="276" text-anchor="end" font-weight="800" fill="#5a3fa6">81</text>
    <rect x="182" y="306" width="380" height="50" rx="12" fill="#fff" stroke="#e3ebef"/>
    <text x="198" y="328" font-weight="700">Blend C-03</text><text x="198" y="345" font-size="11" fill="#6a7d85">Current recipe</text>
    <rect x="410" y="323" width="110" height="10" rx="5" fill="#e3ebef"/><rect x="410" y="323" width="62" height="10" rx="5" fill="#8fa6b1"/><text x="548" y="334" text-anchor="end" font-weight="800" fill="#6a7d85">58</text>
  </g>
  <!-- predicted property chart -->
  <text x="182" y="388" font-size="13" font-weight="700" fill="#13516e">Predicted vs Target</text>
  <g>
    <line x1="182" y1="452" x2="562" y2="452" stroke="#e3ebef"/>
    <line x1="182" y1="412" x2="562" y2="412" stroke="#e96e01" stroke-dasharray="4 5" opacity=".6"/><text x="562" y="406" text-anchor="end" font-size="10.5" font-weight="600" fill="#e96e01">Target</text>
    <rect x="200" y="420" width="26" height="32" rx="5" fill="#ffb066"/><rect x="232" y="404" width="26" height="48" rx="5" fill="#e96e01"/>
    <rect x="296" y="426" width="26" height="26" rx="5" fill="#c9bdf5"/><rect x="328" y="410" width="26" height="42" rx="5" fill="#5a3fa6"/>
    <rect x="392" y="430" width="26" height="22" rx="5" fill="#bfe6d1"/><rect x="424" y="414" width="26" height="38" rx="5" fill="#1f7a4a"/>
    <rect x="488" y="436" width="26" height="16" rx="5" fill="#cfe0ea"/><rect x="520" y="418" width="26" height="34" rx="5" fill="#13516e"/>
  </g>
  <!-- right rail: AI suggestion -->
  <rect x="580" y="96" width="124" height="356" rx="14" fill="#f8f6fe"/>
  <text x="594" y="120" font-size="12" font-weight="700" fill="#5a3fa6">AI Suggests</text>
  <g font-size="11.5" fill="#2b3a40" font-weight="600">
    <text x="594" y="146">Try Blend A-12</text>
    <text x="594" y="164" fill="#6a7d85" font-weight="500">Meets all 3 goals</text>
    <circle cx="642" cy="222" r="34" fill="none" stroke="#ece8f6" stroke-width="9"/>
    <circle cx="642" cy="222" r="34" fill="none" stroke="url(#vi)" stroke-width="9" stroke-dasharray="196 214" transform="rotate(-90 642 222)" stroke-linecap="round"/>
    <text x="642" y="228" text-anchor="middle" font-size="17" font-weight="800" fill="#5a3fa6">92%</text>
    <text x="642" y="276" text-anchor="middle" fill="#6a7d85" font-weight="500">confidence</text>
    <rect x="594" y="300" width="96" height="30" rx="9" fill="#e96e01"/><text x="642" y="319" text-anchor="middle" fill="#fff" font-weight="700">Add to plan</text>
    <rect x="594" y="340" width="96" height="30" rx="9" fill="#fff" stroke="#d9d2f5"/><text x="642" y="359" text-anchor="middle" fill="#5a3fa6" font-weight="700">Why?</text>
  </g>
  <!-- floating guided tip -->
  <g filter="url(#sh2)">
    <rect x="452" y="452" width="290" height="58" rx="16" fill="url(#vi)"/>
  </g>
  <circle cx="478" cy="481" r="13" fill="#fff"/><text x="478" y="486" text-anchor="middle" font-size="14" font-weight="800" fill="#5a3fa6">?</text>
  <text x="500" y="476" font-size="12.5" font-weight="700" fill="#fff">New here? Start with your goal.</text>
  <text x="500" y="494" font-size="11.5" font-weight="500" fill="#efeaff">We'll suggest a recipe to try first.</text>
  <!-- floating flask badge -->
  <g filter="url(#sh2)"><circle cx="58" cy="430" r="36" fill="#fff"/></g>
  <path d="M51 408h14M54 408v14l-12 20a5 5 0 0 0 4 7h24a5 5 0 0 0 4-7l-12-20v-14" fill="none" stroke="#13516e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M47 438h22l3 6a3 3 0 0 1-3 4H47a3 3 0 0 1-3-4z" fill="#e96e01"/>
</svg>
