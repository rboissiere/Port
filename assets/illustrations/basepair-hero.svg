<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Archivo, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece8fb"/><stop offset="1" stop-color="#e3f3fb"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#29a8e0"/><stop offset="1" stop-color="#5b3fd1"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2a1f6b" flood-opacity=".16"/></filter>
  </defs>
  <rect width="640" height="480" rx="26" fill="url(#bg)"/>
  <path d="M120 420c-70-40-80-150-20-230S260 60 360 70s200 60 210 160-40 190-150 210-230 20-300-20z" fill="#d8d0fa" opacity=".55"/>
  <!-- app window -->
  <g filter="url(#sh)">
    <rect x="80" y="70" width="480" height="330" rx="18" fill="#fff"/>
  </g>
  <rect x="80" y="70" width="480" height="44" rx="18" fill="#f5f3fd"/><rect x="80" y="96" width="480" height="18" fill="#f5f3fd"/>
  <circle cx="104" cy="92" r="5" fill="#ff8a7a"/><circle cx="120" cy="92" r="5" fill="#ffc86b"/><circle cx="136" cy="92" r="5" fill="#7fd1a8"/>
  <text x="320" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2350">Your analysis</text>
  <!-- steps -->
  <g font-size="13" font-weight="600" fill="#2b2350">
    <circle cx="116" cy="146" r="12" fill="#29a8e0"/><path d="M110 146l4 4 8-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="151">Upload samples</text>
    <line x1="116" y1="160" x2="116" y2="182" stroke="#d9d3f5" stroke-width="2"/>
    <circle cx="116" cy="196" r="12" fill="#5b3fd1"/><path d="M110 196l4 4 8-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="201">Pick a workflow</text>
    <line x1="116" y1="210" x2="116" y2="232" stroke="#d9d3f5" stroke-width="2"/>
    <circle cx="116" cy="246" r="12" fill="#fff" stroke="#5b3fd1" stroke-width="2.5"/><circle cx="116" cy="246" r="4" fill="#5b3fd1"/>
    <text x="136" y="251">Results ready</text>
  </g>
  <text x="104" y="296" font-size="11" font-weight="600" letter-spacing="1.2" fill="#7b7499">No Code Needed</text>
  <rect x="104" y="310" width="150" height="38" rx="19" fill="url(#btn)"/>
  <text x="179" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Explore results</text>
  <!-- chart card -->
  <rect x="290" y="132" width="246" height="236" rx="14" fill="#faf9ff" stroke="#ebe7fa"/>
  <text x="306" y="156" font-size="12" font-weight="700" fill="#2b2350">Genes that changed</text>
  <line x1="306" y1="350" x2="522" y2="350" stroke="#d9d3f5"/><line x1="414" y1="172" x2="414" y2="350" stroke="#ebe7fa" stroke-dasharray="3 4"/>
  <g fill="#c9c3e6">
    <circle cx="404" cy="338" r="3.5"/><circle cx="420" cy="334" r="3.5"/><circle cx="398" cy="326" r="3.5"/><circle cx="428" cy="322" r="3.5"/><circle cx="410" cy="316" r="3.5"/><circle cx="388" cy="330" r="3.5"/><circle cx="436" cy="336" r="3.5"/><circle cx="416" cy="304" r="3.5"/><circle cx="394" cy="310" r="3.5"/><circle cx="432" cy="310" r="3.5"/><circle cx="380" cy="320" r="3.5"/><circle cx="446" cy="324" r="3.5"/>
  </g>
  <g fill="#29a8e0"><circle cx="352" cy="282" r="5"/><circle cx="338" cy="248" r="5"/><circle cx="366" cy="300" r="5"/><circle cx="328" cy="214" r="6"/><circle cx="358" cy="262" r="4.5"/></g>
  <g fill="#e2407b"><circle cx="472" cy="290" r="5"/><circle cx="488" cy="252" r="5"/><circle cx="464" cy="306" r="4.5"/><circle cx="502" cy="206" r="6"/><circle cx="480" cy="272" r="4.5"/></g>
  <!-- floating chips -->
  <g filter="url(#sh)">
    <rect x="404" y="28" width="206" height="40" rx="20" fill="#fff"/>
  </g>
  <circle cx="426" cy="48" r="7" fill="#e2407b"/>
  <text x="442" y="53" font-size="13" font-weight="700" fill="#2b2350">Ask a Bioinformatician</text>
  <g filter="url(#sh)"><rect x="34" y="372" width="196" height="40" rx="20" fill="#fff"/></g>
  <circle cx="56" cy="392" r="7" fill="#29a8e0"/>
  <text x="72" y="397" font-size="13" font-weight="700" fill="#2b2350">Live help, every week</text>
  <!-- DNA spot -->
  <g filter="url(#sh)"><circle cx="572" cy="404" r="38" fill="#fff"/></g>
  <path d="M556 380c32 16 0 32 32 48M588 380c-32 16 0 32-32 48" stroke="#29a8e0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g stroke="#5b3fd1" stroke-width="3" stroke-linecap="round"><line x1="562" y1="392" x2="582" y2="392"/><line x1="562" y1="416" x2="582" y2="416"/></g>
</svg>
